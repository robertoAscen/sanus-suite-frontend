<div class="row">
  <div class="col-sm-12">
    <app-card [hidHeader]="true">
      <!-- ENCABEZADO -->
      <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
        <div class="d-flex align-items-center">
          <div
            class="text-white bg-primary d-flex align-items-center justify-content-center flex-shrink-0"
            style="width: 44px; height: 44px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0, 123, 255, 0.22); margin-right: 16px;"
          >
            <i class="feather icon-plus-circle" style="font-size: 19px; line-height: 1"></i>
          </div>
          <div class="d-flex flex-column justify-content-center">
            <h4 class="mb-1 font-weight-bold text-dark" style="letter-spacing: 0.5px">Agendar Cita Médica</h4>
            <small class="text-muted">Ingresa los datos para reservar un espacio en la agenda</small>
          </div>
        </div>

        <a [routerLink]="['/citas/citasList']" class="btn btn-outline-secondary font-weight-bold" style="border-radius: 8px">
          <i class="feather icon-arrow-left mr-1"></i> Cancelar / Volver
        </a>
      </div>

      <!-- FORMULARIO -->
      <form [formGroup]="citaForm" (ngSubmit)="guardarCita()">
        <div class="row">
          <!-- SELECCIONAR PACIENTE -->
          <div class="col-md-6 form-group">
            <label class="font-weight-bold">Paciente <span class="text-danger">*</span></label>
            <select
              formControlName="pacienteId"
              class="form-control"
              [ngClass]="{ 'is-invalid': citaForm.get('pacienteId')?.touched && citaForm.get('pacienteId')?.invalid }"
            >
              <option value="">-- Seleccionar Paciente --</option>
              <option *ngFor="let p of pacientes" [value]="p.id">
                {{ p.nombre }} {{ p.apellidoPaterno }} {{ p.apellidoMaterno }} (CURP: {{ p.curp }})
              </option>
            </select>
            <div class="invalid-feedback">Selecciona un paciente de la lista.</div>
          </div>

          <!-- FECHA DE CITA -->
          <div class="col-md-6 form-group">
            <label class="font-weight-bold">Fecha <span class="text-danger">*</span></label>
            <input type="date" formControlName="fecha" class="form-control" />
          </div>

          <!-- HORA INICIO -->
          <div class="col-md-6 form-group">
            <label class="font-weight-bold">Hora de Inicio <span class="text-danger">*</span></label>
            <input type="time" formControlName="horaInicio" class="form-control" />
          </div>

          <!-- DURACIÓN -->
          <div class="col-md-6 form-group">
            <label class="font-weight-bold">Duración Estimada</label>
            <select formControlName="duracionMinutos" class="form-control">
              <option [value]="15">15 minutos</option>
              <option [value]="30">30 minutos</option>
              <option [value]="45">45 minutos</option>
              <option [value]="60">1 hora</option>
            </select>
          </div>

          <!-- MOTIVO CONSULTA -->
          <div class="col-md-12 form-group">
            <label class="font-weight-bold">Motivo de Consulta</label>
            <input
              type="text"
              formControlName="motivoConsulta"
              class="form-control"
              placeholder="Ej: Dolor abdominal, Reagudización de síntomas, Chequeo de rutina..."
            />
          </div>

          <!-- OBSERVACIONES -->
          <div class="col-md-12 form-group">
            <label class="font-weight-bold">Observaciones / Notas de Agenda</label>
            <textarea
              formControlName="observaciones"
              class="form-control"
              rows="3"
              placeholder="Notas opcionales para recepción o recordatorios..."
            ></textarea>
          </div>
        </div>

        <div class="text-right border-top pt-3 mt-2">
          <button
            type="submit"
            class="btn btn-primary font-weight-bold"
            style="border-radius: 8px; padding: 10px 24px"
            [disabled]="cargando"
          >
            <i class="feather icon-check-circle mr-1"></i>
            {{ cargando ? 'Guardando...' : 'Confirmar Cita' }}
          </button>
        </div>
      </form>
    </app-card>
  </div>
</div>
