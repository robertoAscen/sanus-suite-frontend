<div class="row">
  <div class="col-sm-12">
    <app-card [hidHeader]="true">
      <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
        <div class="d-flex align-items-center">
          <div
            class="text-white bg-primary d-flex align-items-center justify-content-center flex-shrink-0 mr-3"
            style="width: 44px; height: 44px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0, 123, 255, 0.22)"
          >
            <i class="feather icon-credit-card" style="font-size: 19px; line-height: 1"></i>
          </div>
          <div class="d-flex flex-column justify-content-center">
            <h4 class="mb-1 font-weight-bold text-dark" style="letter-spacing: 0.5px">Nueva Nota de Venta / Factura</h4>
            <small class="text-muted">Registra el cobro de consultas o servicios médicos</small>
          </div>
        </div>

        <a [routerLink]="['/factura/facturaList']" class="btn btn-outline-secondary font-weight-bold" style="border-radius: 8px">
          <i class="feather icon-arrow-left mr-1"></i> Cancelar / Volver
        </a>
      </div>

      <form [formGroup]="facturaForm" (ngSubmit)="guardarFactura()">
        <div class="row">
          <div class="col-md-12 form-group">
            <label class="font-weight-bold">Paciente <span class="text-danger">*</span></label>
            <select
              formControlName="pacienteId"
              class="form-control"
              [ngClass]="{ 'is-invalid': facturaForm.get('pacienteId')?.touched && facturaForm.get('pacienteId')?.invalid }"
            >
              <option value="">-- Seleccionar Paciente --</option>
              <option *ngFor="let p of pacientes" [value]="p.id">
                {{ p.nombre }} {{ p.apellidoPaterno }} {{ p.apellidoMaterno }} (CURP: {{ p.curp }})
              </option>
            </select>
            <div class="invalid-feedback">Selecciona un paciente para la factura.</div>
          </div>

          <div class="col-md-8 form-group">
            <label class="font-weight-bold">Descripción del Concepto <span class="text-danger">*</span></label>
            <input type="text" formControlName="descripcion" class="form-control" placeholder="Ej. Consulta Médica General" />
          </div>

          <div class="col-md-2 form-group">
            <label class="font-weight-bold">Cantidad <span class="text-danger">*</span></label>
            <input type="number" formControlName="cantidad" class="form-control" min="1" />
          </div>

          <div class="col-md-2 form-group">
            <label class="font-weight-bold">Precio Unitario ($) <span class="text-danger">*</span></label>
            <input type="number" formControlName="precioUnitario" class="form-control" step="0.01" />
          </div>
        </div>

        <div class="text-right border-top pt-3 mt-2">
          <button
            type="submit"
            class="btn btn-primary font-weight-bold"
            style="border-radius: 8px; padding: 10px 24px"
            [disabled]="cargando"
          >
            <i class="feather icon-check-circle mr-1"></i>
            {{ cargando ? 'Guardando...' : 'Generar Nota de Venta' }}
          </button>
        </div>
      </form>
    </app-card>
  </div>
</div>
